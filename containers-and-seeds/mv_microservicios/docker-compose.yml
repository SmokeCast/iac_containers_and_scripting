services:
  ms1:
    image: empuiquin24/smokecast-ms1-fire-catalog:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8081
      HOST: 0.0.0.0
      PUBLIC_BASE_PATH: ${MS1_PUBLIC_BASE_PATH:-/}
      PUBLIC_OPENAPI_URL: ${MS1_PUBLIC_OPENAPI_URL:-openapi.json}
      DB_URL: jdbc:mysql://${MYSQL_HOST:-127.0.0.1}:3306/db1_fire_catalog
      DB_USERNAME: ${MYSQL_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ms2:
    image: empuiquin24/smokecast-ms2-urban-exposure:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8082
      HOST: 0.0.0.0
      PUBLIC_BASE_PATH: ${MS2_PUBLIC_BASE_PATH:-/}
      DB_HOST: ${POSTGRES_HOST:-127.0.0.1}
      DB_PORT: 5432
      DB_NAME: db2_urban_exposure
      DB_USER: ${POSTGRES_USER:-smokecast_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ms3:
    image: empuiquin24/smokecast-ms3-atmosphere-feed:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8083
      HOST: 0.0.0.0
      PUBLIC_BASE_PATH: ${MS3_PUBLIC_BASE_PATH:-/}
      MONGO_URI: mongodb://${MONGO_HOST:-127.0.0.1}:27017
      MONGO_DB_NAME: db3_atmosphere_feed
      WEATHER_COLLECTION: weather_readings
      MONGO_AUTH_SOURCE: admin
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-smokecast_admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MS2_URL: ${MS2_URL:-http://ms2:8082}
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ms4:
    image: empuiquin24/smokecast-ms4-smoke-brain:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8084
      HOST: 0.0.0.0
      MS1_URL: ${MS1_URL:-http://ms1:8081}
      MS2_URL: ${MS2_URL:-http://ms2:8082}
      MS3_URL: ${MS3_URL:-http://ms3:8083}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      RISK_RADIUS_KM: ${RISK_RADIUS_KM:-150}
      PUBLIC_BASE_PATH: ${MS4_PUBLIC_BASE_PATH:-/}
    ports:
      - "8084:8084"
    depends_on: [ms1, ms2, ms3]

  ms5:
    image: empuiquin24/smokecast-ms5-analytics-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8085
      HOST: 0.0.0.0
      ATHENA_ENABLED: ${ATHENA_ENABLED:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ATHENA_DATABASE: ${ATHENA_DATABASE:-smokecast_analytics}
      ATHENA_CATALOG: ${ATHENA_CATALOG:-AwsDataCatalog}
      ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-primary}
      ATHENA_OUTPUT_S3: ${ATHENA_OUTPUT_S3:-}
      PUBLIC_BASE_PATH: ${MS5_PUBLIC_BASE_PATH:-/}
    ports:
      - "8085:8085"

networks:
  default:
    name: smokecast_prod_network
    driver: bridge
